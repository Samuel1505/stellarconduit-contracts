[package]
name = "relay-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stellarconduitd"
path = "src/bin/stellarconduitd.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
